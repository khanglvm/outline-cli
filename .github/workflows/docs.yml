# Checks docs/ against the docs.khangle.dev contract and that README blocks match their pages.
# Read-only and separate from publishing, so a docs problem never blocks a release.
name: docs

on:
  push:
    paths: [docs/**, README.md, scripts/docs-readme.mjs]
  pull_request:
    paths: [docs/**, README.md, scripts/docs-readme.mjs]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/docs-readme.mjs --check
