# Checks docs/ against the docs.khangle.dev contract and that README blocks match their pages.
# Read-only and separate from publishing, so a docs problem never blocks a release.
name: docs

on:
  push:
    paths: [docs/**, README.md, scripts/docs-readme.mjs]
  pull_request:
    paths: [docs/**, README.md, scripts/docs-readme.mjs]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/docs-readme.mjs --check

  # A docs change on the default branch reaches docs.khangle.dev now, not at the
  # site's next scheduled sync. DOCS_SYNC_TOKEN: fine-grained token for
  # khanglvm/docs with Actions read and write.
  sync-site:
    needs: check
    if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refresh docs.khangle.dev
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::DOCS_SYNC_TOKEN is not set; docs.khangle.dev updates on its next scheduled sync."
            exit 0
          fi
          gh workflow run sync.yml --repo khanglvm/docs --ref main
